name: Build Android APK

on:
  push:
    branches:
      - main
      - agent/video-seekbar-keep-playing-v136
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore packaged v1.3 sources
        shell: bash
        run: |
          if compgen -G ".v13/part-*" > /dev/null; then
            cat .v13/part-* > /tmp/apv13-src.tar.gz.b64
            base64 --decode /tmp/apv13-src.tar.gz.b64 > /tmp/apv13-src.tar.gz
            echo "42cc2826898d7eec4a4eb3e554f861b60c661c47f9fc10238f3644c367e5c6df  /tmp/apv13-src.tar.gz" | sha256sum --check
            tar -xzf /tmp/apv13-src.tar.gz
          fi

      - name: Apply v1.3.1 fixes
        run: git apply --verbose tools/v131.patch

      - name: Apply v1.3.2 image decoder fix
        run: python3 tools/apply_v132.py

      - name: Apply v1.3.3 image layer fix
        run: git apply --verbose tools/v133.patch

      - name: Apply v1.3.4 large image render fix
        run: python3 tools/apply_v134.py

      - name: Apply v1.3.5 rebuilt image viewer
        run: python3 tools/apply_v135.py

      - name: Apply v1.3.6 video seek controls
        run: python3 tools/apply_v136.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fotobezprechodu-debug-keystore-v1

      - name: Create debug signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=CZ" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk FotoBezPrechodu-v1.3.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foto-bez-prechodu-v1.3.6
          path: FotoBezPrechodu-v1.3.6.apk
          if-no-files-found: error
          retention-days: 30
