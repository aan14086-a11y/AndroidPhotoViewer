name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk FotoBezPrechodu-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foto-bez-prechodu-v1.1.0
          path: FotoBezPrechodu-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30
